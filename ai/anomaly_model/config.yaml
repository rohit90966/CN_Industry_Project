label_min_y: 20

visualization_rows: 1
visualization_columns: 4
visualization_figure_width: 16.0
visualization_figure_height: 4.0
visualization_dpi: 150

colorbar_fraction: 0.046
colorbar_padding: 0.04

seed: 42

output_root: ../output
